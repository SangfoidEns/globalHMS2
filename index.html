<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brisa Analytics</title>
    <link rel="stylesheet" href="css/styles.css">
    <!-- Системний шрифт Apple / Telegram UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Фон майбутнього iPhone: Deep Titan + Cyber Glass -->
    <div class="wallpaper-bg">
        <div class="ambient-glow glow-titan"></div>
        <div class="ambient-glow glow-gold"></div>
        <div class="glass-mesh"></div>
    </div>

    <!-- Основний контейнер iOS / Telegram -->
    <main class="app-viewport">
        
        <!-- Шапка у стилі iOS Navigation Bar -->
        <header class="ios-navbar">
            <div class="tg-status">
                <span class="tg-indicator"></span>
                <span class="tg-status-text">Brisa Bot • online</span>
            </div>
            <h1 class="ios-title">Аналітика</h1>
            <p class="ios-subtitle">Система майбутнього часу</p>
        </header>

        <!-- Картка Telegram WebApp / iOS Card -->
        <section class="ios-card">
            <div class="card-header">
                <div class="app-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="#0088CC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M2 17L12 22L22 17" stroke="#E5C158" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M2 12L12 17L22 12" stroke="#0088CC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <div class="card-info">
                    <span class="card-title">Глибокий аналіз</span>
                    <span class="card-time">Щойно оновлено</span>
                </div>
            </div>

            <div class="card-body">
                <p>Інтерфейс завантажено з підтримкою технології **Liquid Glass UI**.</p>
            </div>

            <!-- Головна кнопка Telegram MainButton / iOS Action -->
            <button class="tg-main-button" onclick="this.classList.toggle('active')">
                <span>Запустити процес</span>
                <div class="btn-highlight"></div>
            </button>
        </section>

    </main>

    <script src="js/app.js"></script>
</body>
</html>
